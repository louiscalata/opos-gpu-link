name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    name: Companion tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run companion tests
        run: python3 -B -m unittest discover -s companion -p 'test_*.py' -v

  phone-service:
    name: Phone-service public suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run phone-service public suite
        working-directory: phone-service
        run: PYTHONPATH=src python3 -B -m unittest tests.test_run_link tests.test_link_api tests.test_gpu_link_proto tests.test_gpu_link_server -v

  android-host:
    name: Android host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android host tests
        working-directory: android
        run: ./scripts/run-host-tests.sh
